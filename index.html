<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background">
    <div class="overlay"></div>
    <header>
      <img src="./assets/Netflix-Logo.png" alt="Netflix Logo" class="logo">
      <a href="signin.html"><button class="signin-btn">Sign In</button></a>
    </header>
    <div class="content">
      <h1 class="fade-in">Unlimited movies, TV shows, and more.</h1>
      <p class="subtext fade-in">Watch anywhere. Cancel anytime.</p>
      <p class="subtext fade-in">Ready to watch? Enter your email to create or restart your membership.</p>
      <form class="fade-in">
        <input type="email" placeholder="Email address" required>
        <button type="submit">Get Started &gt;</button>
      </form>
    </div>
  </div>

  <!-- 🔥 Trending Now Section -->
  <section class="trending">
    <h2>Trending Now</h2>
    <div class="trending-container">
      <div class="trending-item">
        <span class="trending-number">1</span>
        <img src="./assets/puspa.jpg" alt="Pushpa 2 Poster" class="trending-img">
      </div>
      <div class="trending-item">
        <span class="trending-number">2</span>
        <img src="./assets/game.jpg" alt="Squid Game Poster" class="trending-img">
      </div>
      <div class="trending-item">
        <span class="trending-number">3</span>
        <img src="./assets/First-Look-Poster-of-the-Movie-Lucky-Baskhar.webp" alt="Lucky Baskhar Poster" class="trending-img">
      </div>
      <div class="trending-item">
        <span class="trending-number">4</span>
        <img src="./assets/dear vdk.jpg" alt="Venom Poster" class="trending-img">
      </div>
      <div class="trending-item">
        <span class="trending-number">5</span>
        <img src="./assets/cin.jpg" alt="Bhool Bhulaiyaa 3 Poster" class="trending-img">
      </div>
    </div>
  </section>
</body>
</html>
